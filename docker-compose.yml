services:
  postgres:
    image: postgres:16-alpine
    container_name: knust-pulse-db
    environment:
      POSTGRES_USER: knust
      POSTGRES_PASSWORD: knust123
      POSTGRES_DB: knust_pulse
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knust -d knust_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
